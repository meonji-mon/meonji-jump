<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>먼지 달려</title>
<style>
:root{--bg:#fff;--fg:#111;--mute:#888}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#f0f0f0;--mute:#777}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;width:100%;max-width:960px}
#mute{position:fixed;top:12px;right:12px;background:none;border:1.5px solid var(--fg);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
</style></head><body>
<div id="wrap"><canvas id="c" aria-label="먼지 달려 게임"></canvas></div>
<button id="mute" type="button">소리 켜짐</button>
<script>
(()=>{
let W=800;const H=260,GROUND=210,cv=document.getElementById('c'),cx=cv.getContext('2d');
let dpr=1;
function fit(){W=innerWidth<600?440:800;dpr=Math.min(window.devicePixelRatio||1,3);const w=Math.min(innerWidth,960);cv.style.height=(w*H/W)+'px';cv.width=W*dpr;cv.height=H*dpr;}
addEventListener('resize',fit);fit();
const mq=matchMedia('(prefers-color-scheme: dark)');
const col=()=>mq.matches?{bg:'#0d1117',fg:'#f0f0f0',mu:'#6e7681'}:{bg:'#ffffff',fg:'#111111',mu:'#9a9a9a'};
// audio
const ext=new Audio().canPlayType('audio/ogg; codecs="vorbis"')?'ogg':'mp3';
let actx=null,bufs={},muted=localStorage.getItem('mj_mute')==='1';
const mb=document.getElementById('mute');
const setMB=()=>mb.textContent=muted?'소리 꺼짐':'소리 켜짐';setMB();
mb.addEventListener('click',e=>{e.stopPropagation();muted=!muted;localStorage.setItem('mj_mute',muted?'1':'0');setMB();mb.blur();});
mb.addEventListener('pointerdown',e=>e.stopPropagation());
function initAudio(){if(actx)return;try{actx=new (window.AudioContext||window.webkitAudioContext)();
['jump','hit','score'].forEach(n=>fetch('sfx/'+n+'.'+ext).then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(d=>bufs[n]=d).catch(()=>{}));}catch(e){}}
function play(n,v=0.5){if(muted||!actx||!bufs[n])return;const s=actx.createBufferSource(),g=actx.createGain();g.gain.value=v;s.buffer=bufs[n];s.connect(g).connect(actx.destination);s.start();}
// state
const cat={x:70,y:GROUND,vy:0,w:44,h:34,ground:true};
let state='ready',obs=[],speed,score,best=+localStorage.getItem('mj_best')||0,t=0,next,holding=false,last=0,dust=[],flash=0,newBest=false;
const MAXS=11,G=0.9,JV=-13.5;
function reset(){obs=[];speed=6;score=0;cat.y=GROUND;cat.vy=0;cat.ground=true;next=60;newBest=false;}
reset();
function press(){initAudio();if(actx&&actx.state==='suspended')actx.resume();
 if(state==='ready'){state='play';jump();return}
 if(state==='over'){if(t-last<25)return;reset();state='play';return}
 jump();}
function jump(){holding=true;if(cat.ground){cat.vy=JV;cat.ground=false;play('jump',0.35);}}
function release(){holding=false;}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)press();}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')release();});
addEventListener("pointerdown",e=>{if(e.target===mb)return;e.preventDefault();press();});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function spawn(){
 const big=Math.random()<0.3+Math.min(score/3000,0.3);
 const r=big?17:12;const n=(score>400&&Math.random()<0.25)?2:1;
 for(let i=0;i<n;i++)obs.push({x:W+20+i*r*1.8,r,seed:Math.random()*6});
 // airtime ~ 2*13.5/0.9 = 30 frames; minimum gap guarantees landing+rejump at any speed
 const minGap=speed*34+60;next=Math.max(minGap,(minGap+Math.random()*260))/speed;}
function update(){t++;
 if(state!=='play'){return}
 speed=Math.min(MAXS,6+score/250);
 // variable jump: release early cuts rise
 if(!cat.ground){cat.vy+=(!holding&&cat.vy<0)?G*2.2:G;cat.y+=cat.vy;
  if(cat.y>=GROUND){cat.y=GROUND;cat.vy=0;cat.ground=true;for(let i=0;i<5;i++)dust.push({x:cat.x+10+Math.random()*20,y:GROUND,vx:-Math.random()*2,vy:-Math.random()*1.5,l:20});}}
 if(--next<=0)spawn();
 for(const o of obs){o.x-=speed;o.seed+=0.15;}
 obs=obs.filter(o=>o.x>-40);
 const prev=Math.floor(score/100);score+=speed/10;
 if(Math.floor(score/100)>prev){play('score',0.25);flash=30;}
 dust.forEach(d=>{d.x+=d.vx-speed*0.3;d.y+=d.vy;d.l--});dust=dust.filter(d=>d.l>0);
 // forgiving hitbox: inset cat box, shrink dust radius
 const bx=cat.x+8,by=cat.y-cat.h+8,bw=cat.w-16,bh=cat.h-10;
 for(const o of obs){const ox=o.x,oy=GROUND-o.r,rr=o.r*0.72;
  const nx=Math.max(bx,Math.min(ox,bx+bw)),ny=Math.max(by,Math.min(oy,by+bh));
  if((nx-ox)**2+(ny-oy)**2<rr*rr){state='over';last=t;play('hit',0.5);
   if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem('mj_best',best);newBest=true;}break;}}
}
function drawCat(c){const x=cat.x,y=cat.y;cx.fillStyle=c.fg;
 const run=state==='play'&&cat.ground?Math.floor(t/5)%2:0;
 // body
 cx.beginPath();cx.roundRect(x,y-26,40,20,10);cx.fill();
 // head
 cx.beginPath();cx.roundRect(x+22,y-36,24,22,9);cx.fill();
 // ears (m-symbol style)
 cx.beginPath();cx.moveTo(x+23,y-30);cx.lineTo(x+26,y-44);cx.lineTo(x+33,y-34);cx.closePath();cx.fill();
 cx.beginPath();cx.moveTo(x+35,y-34);cx.lineTo(x+42,y-44);cx.lineTo(x+45,y-30);cx.closePath();cx.fill();
 // eyes
 cx.fillStyle=c.bg;const blink=(t%180)<6;
 if(state==='over'){cx.font='bold 9px sans-serif';cx.fillText('x',x+28,y-24);cx.fillText('x',x+37,y-24);}
 else if(!blink){cx.beginPath();cx.arc(x+31,y-27,2.3,0,7);cx.arc(x+39,y-27,2.3,0,7);cx.fill();}
 // whiskers
 cx.strokeStyle=c.fg;cx.lineWidth=1.3;cx.beginPath();cx.moveTo(x+44,y-22);cx.lineTo(x+53,y-24);cx.moveTo(x+44,y-19);cx.lineTo(x+53,y-17);cx.stroke();
 // legs
 cx.fillStyle=c.fg;const a=cat.ground?(run?4:0):2;
 cx.fillRect(x+4+a,y-8,5,8);cx.fillRect(x+28-a,y-8,5,8);
 // tail
 cx.lineWidth=4;cx.lineCap='round';cx.beginPath();cx.moveTo(x+2,y-20);cx.quadraticCurveTo(x-10,y-26+(run?3:-3),x-8,y-38);cx.stroke();}
function drawDust(o,c){cx.fillStyle=c.fg;const cy=GROUND-o.r;cx.beginPath();
 for(let i=0;i<14;i++){const a=i/14*Math.PI*2,rr=o.r*(0.85+0.18*Math.sin(i*2.7+o.seed));cx.lineTo(o.x+Math.cos(a)*rr,cy+Math.sin(a)*rr);}
 cx.closePath();cx.fill();cx.fillStyle=c.bg;cx.beginPath();cx.arc(o.x-o.r*0.3,cy-o.r*0.15,1.8,0,7);cx.arc(o.x+o.r*0.15,cy-o.r*0.15,1.8,0,7);cx.fill();}
function draw(){const c=col();cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle=c.bg;cx.fillRect(0,0,W,H);
 cx.strokeStyle=c.fg;cx.lineWidth=1.5;cx.beginPath();cx.moveTo(0,GROUND+.5);cx.lineTo(W,GROUND+.5);cx.stroke();
 cx.fillStyle=c.mu;const off=(t*(state==='play'?speed:0))%40;for(let i=0;i<22;i++)cx.fillRect(((i*40-off)%W+W)%W,GROUND+10+(i*7)%18,i%3?3:6,1.5);
 dust.forEach(d=>{cx.globalAlpha=d.l/20;cx.fillRect(d.x,d.y-2,2,2)});cx.globalAlpha=1;
 obs.forEach(o=>drawDust(o,c));drawCat(c);
 cx.fillStyle=(flash>0&&Math.floor(flash/5)%2)?c.mu:c.fg;if(flash>0)flash--;
 cx.font='600 16px ui-monospace,Menlo,Consolas,monospace';cx.textAlign='right';
 cx.fillText(String(Math.floor(score)).padStart(5,'0'),W-20,32);
 cx.fillStyle=c.mu;cx.font='13px inherit';cx.font='13px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
 cx.fillText('최고 기록 '+String(best).padStart(5,'0'),W-20,52);
 cx.textAlign='center';cx.fillStyle=c.fg;
 if(state==='ready'){cx.font='700 26px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';cx.fillText('먼지 달려',W/2,95);
  cx.font='15px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';cx.fillStyle=c.mu;cx.fillText(W<600?'점프하려면 탭 · 길게 누르면 더 높이':'점프하려면 스페이스 / 탭 · 길게 누르면 더 높이',W/2,125);}
 if(state==='over'){cx.font='700 26px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';cx.fillText('게임 오버',W/2,90);
  cx.font='15px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';cx.fillStyle=c.mu;
  cx.fillText(newBest?'새 최고 기록!':'점수 '+Math.floor(score),W/2,118);
  cx.fillStyle=c.fg;cx.lineWidth=1.5;cx.beginPath();cx.roundRect(W/2-55,132,110,34,8);cx.stroke();cx.fillText('다시 하기',W/2,154);}}
let acc=0,lt=performance.now();
function loop(n){acc+=Math.min(n-lt,100);lt=n;while(acc>=1000/60){update();acc-=1000/60;}draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__mj={get speed(){return speed},get state(){return state},get score(){return score},get obs(){return obs},press,release};
})();
</script></body></html>
